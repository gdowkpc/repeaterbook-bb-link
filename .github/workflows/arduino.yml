name: DevKitC experimental build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - name: Install pinned ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.15 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli lib install ArduinoQueue@1.2.5 ArduinoLog@1.1.1
      - name: Compile experimental application
        run: >-
          arduino-cli compile
          --fqbn esp32:esp32:esp32:FlashMode=dio,FlashFreq=40,FlashSize=4M,PartitionScheme=min_spiffs,PSRAM=disabled
          --build-property compiler.cpp.extra_flags=-DBB_LINK_DEVKITC_32E
          --output-dir build-devkitc src/bb-link
      - uses: actions/upload-artifact@v4
        with:
          name: devkitc-experimental-application-not-factory-image
          path: build-devkitc/*.bin
